<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a3535">

<!-- iOS home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Donna's Garden">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- General -->
<title>Donna's Garden ✿</title>
<meta name="description" content="A living orchid and daily notes from the universe, just for Donna.">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Playfair+Display+SC:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --deep:   #071e1e;
  --mid:    #0d3535;
  --teal:   #155050;
  --bright: #1a7070;
  --pale:   #4dbcbc;
  --gold:   #c9a84c;
  --gold-l: #e8d5a3;
  --cream:  #faf7f0;
  --op:     #7b68c2;
  --op-l:   #b0a0e8;
  --op-p:   #d4a8cc;
  --green:  #2a6040;
}

html, body {
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: var(--deep);
  background-image:
    radial-gradient(ellipse at 20% 15%, rgba(26,112,112,0.14) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(123,104,194,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(201,168,76,0.015) 40px, rgba(201,168,76,0.015) 41px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(201,168,76,0.015) 40px, rgba(201,168,76,0.015) 41px);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  color: var(--cream);
  padding: env(safe-area-inset-top, 16px) 12px env(safe-area-inset-bottom, 24px);
}

/* ─── OUTER FRAME ─── */
.outer-frame {
  width: 100%;
  max-width: 520px;
  padding: 10px;
  border: 1px solid rgba(201,168,76,0.3);
  background: repeating-linear-gradient(
    45deg,
    transparent, transparent 3px,
    rgba(201,168,76,0.03) 3px, rgba(201,168,76,0.03) 6px
  );
  box-shadow: 0 0 0 3px var(--deep), 0 0 0 4px rgba(201,168,76,0.2), 0 0 50px rgba(0,0,0,0.8);
  margin: 12px 0;
}

/* ─── PAGE ─── */
.page {
  background: linear-gradient(180deg, #0e3d3d 0%, #0a3030 55%, #071e1e 100%);
  border: 2px solid var(--gold);
  position: relative;
  padding: 32px 26px 28px;
}
.page::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(201,168,76,0.2);
  pointer-events: none;
}
.page::after {
  content: '';
  position: absolute;
  inset: 11px;
  border: 1px solid rgba(201,168,76,0.08);
  pointer-events: none;
}

.corner { position: absolute; font-size: 18px; color: var(--gold); pointer-events: none; }
.corner-tl { top: 13px; left: 13px; }
.corner-tr { top: 13px; right: 13px; }
.corner-bl { bottom: 13px; left: 13px; }
.corner-br { bottom: 13px; right: 13px; }

/* ─── HEADER ─── */
.header { text-align: center; margin-bottom: 2px; }

.crown { color: var(--gold); font-size: 18px; letter-spacing: 12px; margin-bottom: 4px; display: block; }

.title {
  font-family: 'Playfair Display SC', serif;
  font-size: clamp(2em, 8vw, 2.6em);
  color: var(--gold-l);
  letter-spacing: 5px;
  text-shadow: 0 0 30px rgba(201,168,76,0.45), 0 2px 4px rgba(0,0,0,0.5);
  margin: 4px 0 8px;
  line-height: 1.15;
}

.subtitle {
  font-style: italic;
  color: var(--pale);
  font-size: 1em;
  letter-spacing: 1.5px;
  opacity: 0.95;
}

.header-orn { color: var(--gold); font-size: 13px; letter-spacing: 8px; margin-top: 7px; display: block; opacity: 0.75; }

/* ─── DIVIDERS ─── */
.div { text-align: center; color: var(--gold); font-size: 14px; letter-spacing: 8px; margin: 12px 0; opacity: 0.65; }
.div-line { border: none; border-top: 1px solid rgba(201,168,76,0.2); margin: 12px 0; }

/* ─── DATE ─── */
.date-area { text-align: center; margin-bottom: 6px; }
.date-display { font-size: 0.9em; color: var(--gold-l); letter-spacing: 2px; text-transform: uppercase; font-style: italic; }
.day-count { font-family: 'Playfair Display SC', serif; font-size: 0.78em; color: var(--pale); letter-spacing: 1.5px; margin-top: 4px; opacity: 0.9; }

/* ─── PLANT ─── */
.plant-outer { display: flex; justify-content: center; margin-bottom: 2px; }

.plant-frame {
  width: min(260px, 75vw);
  height: min(300px, 85vw);
  background: linear-gradient(180deg, #041414 0%, #0a2828 65%, #071e1e 100%);
  border: 1px solid var(--gold);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 0 20px rgba(201,168,76,0.12), 0 0 0 4px var(--deep), 0 0 0 5px rgba(201,168,76,0.18);
  transition: box-shadow 0.8s ease;
}
.plant-frame::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(201,168,76,0.18);
  pointer-events: none;
}
.plant-frame.watered { animation: plantGlow 1.4s ease; }

@keyframes plantGlow {
  0%   { box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 0 20px rgba(201,168,76,0.12), 0 0 0 4px var(--deep), 0 0 0 5px rgba(201,168,76,0.18); }
  45%  { box-shadow: inset 0 0 50px rgba(0,0,0,0.2), 0 0 60px rgba(77,188,188,0.65), 0 0 0 4px var(--deep), 0 0 0 5px rgba(77,188,188,0.55); }
  100% { box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 0 20px rgba(201,168,76,0.12), 0 0 0 4px var(--deep), 0 0 0 5px rgba(201,168,76,0.18); }
}

.orchid-svg { width: 90%; height: 90%; }

/* ─── STAGE LABEL ─── */
.stage-label { text-align: center; font-style: italic; color: #d8f0f0; font-size: 1.05em; margin: 10px 0 16px; letter-spacing: 0.5px; min-height: 1.4em; }

/* ─── PROGRESS ─── */
.progress-wrap { margin: 10px 0 4px; }
.progress-label { font-size: 0.72em; color: rgba(201,168,76,0.65); letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
.progress-track { height: 5px; background: rgba(255,255,255,0.06); border: 1px solid rgba(201,168,76,0.15); position: relative; overflow: hidden; border-radius: 3px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--bright), var(--pale)); transition: width 1s ease; box-shadow: 0 0 8px rgba(77,188,188,0.5); border-radius: 3px; }
.progress-stage { text-align: center; margin-top: 7px; font-size: 0.8em; color: var(--pale); font-style: italic; letter-spacing: 1px; }

/* ─── QUOTE ─── */
.quote-frame {
  border: 1px solid rgba(201,168,76,0.55);
  background: rgba(0,0,0,0.28);
  padding: 28px 24px 22px;
  position: relative;
  margin-bottom: 20px;
}
.quote-frame::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(201,168,76,0.12);
  pointer-events: none;
}
.quote-topper {
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%);
  background: #0a3030;
  padding: 0 12px;
  color: var(--gold);
  font-size: 17px;
  white-space: nowrap;
}
.quote-label {
  text-align: center;
  font-family: 'Playfair Display SC', serif;
  font-size: 0.7em;
  color: var(--gold);
  letter-spacing: 4px;
  margin-bottom: 16px;
  text-transform: uppercase;
  opacity: 0.9;
}
.quote-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.25em, 4.5vw, 1.4em);
  line-height: 1.9;
  text-align: center;
  color: #fff;
}
.quote-sig {
  text-align: right;
  font-size: 0.82em;
  color: var(--gold-l);
  margin-top: 14px;
  letter-spacing: 2px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  opacity: 0.9;
}

/* ─── CARE ─── */
.care-section { text-align: center; margin-bottom: 20px; }

.care-label {
  font-family: 'Playfair Display SC', serif;
  font-size: 0.75em;
  color: var(--gold);
  letter-spacing: 4px;
  margin-bottom: 16px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.care-label::before, .care-label::after { content: '·····'; color: rgba(201,168,76,0.35); letter-spacing: 2px; }

.water-btn {
  background: linear-gradient(135deg, #1a6060 0%, #0d3535 100%);
  border: 2px solid var(--gold);
  color: var(--gold-l);
  font-family: 'Playfair Display SC', serif;
  font-size: 1.05em;
  letter-spacing: 3px;
  padding: 18px 40px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  width: 100%;
  max-width: 340px;
}
.water-btn::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(201,168,76,0.28);
  pointer-events: none;
}
.water-btn:active:not(:disabled) { transform: scale(0.97); }
.water-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.water-btn.done { border-color: var(--pale); color: var(--pale); background: linear-gradient(135deg, #0d3535 0%, #071e1e 100%); }

/* ─── STATS ─── */
.stats {
  display: flex;
  justify-content: center;
  border-top: 1px solid rgba(201,168,76,0.2);
  border-bottom: 1px solid rgba(201,168,76,0.2);
  padding: 18px 0;
  margin-bottom: 4px;
}
.stat { text-align: center; flex: 1; padding: 0 8px; position: relative; }
.stat + .stat::before {
  content: '';
  position: absolute;
  left: 0; top: 10%; height: 80%;
  width: 1px;
  background: rgba(201,168,76,0.2);
}
.stat-num { display: block; font-family: 'Playfair Display SC', serif; font-size: 2em; color: var(--gold-l); line-height: 1.1; }
.stat-label { font-size: 0.72em; color: var(--pale); letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85; margin-top: 5px; display: block; }

/* ─── FOOTER ─── */
.footer-orn { text-align: center; color: var(--gold); font-size: 12px; letter-spacing: 5px; margin-top: 14px; opacity: 0.6; }

/* ─── BOTANICAL CORNERS ─── */
.botanical-corner {
  position: absolute;
  width: 80px;
  height: 80px;
  pointer-events: none;
  opacity: 0.82;
}
.botanical-corner.tl { top: 0; left: 0; }
.botanical-corner.tr { top: 0; right: 0; transform: scaleX(-1); }
.botanical-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
.botanical-corner.br { bottom: 0; right: 0; transform: scale(-1); }

/* ─── FLOATING PETALS ─── */
#petal-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.petal {
  position: absolute;
  top: -30px;
  pointer-events: none;
  user-select: none;
  animation: petalFall linear forwards;
  opacity: 0;
}
@keyframes petalFall {
  0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
  8%   { opacity: 0.7; }
  85%  { opacity: 0.4; }
  100% { transform: translateY(105vh) rotate(420deg) translateX(40px); opacity: 0; }
}

/* ─── FANCY DIVIDER ─── */
.fancy-div {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 14px 0;
}
.fancy-div svg { display: block; }

/* ─── TWINKLING STARS ─── */
.twinkle {
  position: fixed;
  pointer-events: none;
  animation: twinkleAnim ease-in-out infinite;
  z-index: 0;
  color: var(--gold);
  font-size: 8px;
  opacity: 0;
}
@keyframes twinkleAnim {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%       { opacity: 0.4; transform: scale(1); }
}

/* ─── QUOTE CORNER ACCENTS ─── */
.quote-corner {
  position: absolute;
  width: 28px;
  height: 28px;
  opacity: 0.7;
}
.quote-corner.tl { top: 6px; left: 6px; }
.quote-corner.tr { top: 6px; right: 6px; transform: scaleX(-1); }
.quote-corner.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
.quote-corner.br { bottom: 6px; right: 6px; transform: scale(-1); }

/* ─── SPARKLES ─── */
.sparkle {
  position: absolute;
  pointer-events: none;
  animation: sparklePop 1.1s ease forwards;
  z-index: 10;
  font-size: 13px;
  user-select: none;
}
@keyframes sparklePop {
  0%   { opacity: 0; transform: scale(0) rotate(0deg); }
  40%  { opacity: 1; transform: scale(1.4) rotate(15deg); }
  100% { opacity: 0; transform: scale(0.4) rotate(50deg) translateY(-18px); }
}

/* ─── NOTIFICATION ─── */
.notif {
  position: fixed;
  top: max(env(safe-area-inset-top, 0px), 20px);
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  background: linear-gradient(135deg, #0d3535, #0a2828);
  border: 1px solid var(--gold);
  color: var(--cream);
  padding: 12px 24px;
  font-family: 'IM Fell English', serif;
  font-style: italic;
  font-size: 0.9em;
  text-align: center;
  pointer-events: none;
  max-width: min(380px, 90vw);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(77,188,188,0.2);
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  z-index: 100;
  white-space: nowrap;
}
.notif.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── NEW BLOOM MODAL ─── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  padding: 20px;
}
.modal-bg.show { opacity: 1; pointer-events: all; }
.modal {
  background: linear-gradient(135deg, #0e3d3d, #0a2828);
  border: 2px solid var(--gold);
  padding: 36px 30px;
  text-align: center;
  max-width: 380px;
  width: 100%;
  position: relative;
}
.modal::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(201,168,76,0.25); pointer-events: none; }
.modal-orn { color: var(--gold); font-size: 20px; letter-spacing: 8px; margin-bottom: 10px; }
.modal-title { font-family: 'Playfair Display SC', serif; font-size: 1.6em; color: var(--gold-l); letter-spacing: 3px; margin-bottom: 14px; }
.modal-msg { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2em; line-height: 1.85; color: #fff; margin-bottom: 24px; }
.modal-btn {
  background: linear-gradient(135deg, #1a6060, #0d3535);
  border: 1px solid var(--gold);
  color: var(--gold-l);
  font-family: 'Playfair Display SC', serif;
  font-size: 0.9em;
  letter-spacing: 3px;
  padding: 14px 36px;
  cursor: pointer;
  text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>

  <div class="modal" onclick="event.stopPropagation()">

    <div class="modal-msg" id="modalMsg">—</div>
    <button class="modal-btn" onclick="closeModal()">✦ &nbsp; Continue &nbsp; ✦</button>

          <g transform="translate(120,152)">
            <ellipse cx="0" cy="-14" rx="10" ry="15" fill="#9080d4" opacity="0.9"/>

            <ellipse cx="-13" cy="5" rx="12" ry="16" fill="#a890e0" opacity="0.85" transform="rotate(-61,-13,5)"/>
            <path d="M0,4 Q-6,12 -4,19 Q0,23 4,19 Q6,12 0,4" fill="#dcc0d8"/>
            <circle cx="0" cy="5" r="6" fill="#f8f2c8"/>
            <circle cx="0" cy="5" r="3.5" fill="#ece8a8"/>
            <circle cx="0" cy="5" r="1.5" fill="#d0c888" opacity="0.7"/>
          </g>
          <!-- Ambient sparkles -->
          <text x="52" y="52" fill="#4dbcbc" font-size="9" opacity="0.5">✦</text>
          <text x="188" y="48" fill="#4dbcbc" font-size="7" opacity="0.4">✦</text>
          <text x="40" y="110" fill="#c9a84c" font-size="7" opacity="0.35">✦</text>
          <text x="195" y="105" fill="#c9a84c" font-size="8" opacity="0.4">✦</text>
          <text x="58" y="170" fill="#4dbcbc" font-size="6" opacity="0.3">✦</text>
          <text x="180" y="165" fill="#4dbcbc" font-size="6" opacity="0.3">✦</text>

      </svg>
    </div>
  </div>

  <div class="stage-label" id="stageLabel">—</div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-label">Garden Journey</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-stage" id="progressStageLabel">Stage 1 of 6 — Seed</div>
  </div>

  <!-- Fancy divider with leaves -->
  <div class="fancy-div">
    <svg width="240" height="26" viewBox="0 0 240 26" fill="none">
      <line x1="0" y1="13" x2="80" y2="13" stroke="#c9a84c" stroke-width="0.8" opacity="0.35"/>
      <path d="M86,13 Q90,6 96,13" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M88,15 Q84,8 90,7 Q90,13 88,15" fill="#2a6040" opacity="0.55"/>
      <g transform="translate(120,13)">
        <ellipse cx="0" cy="-5" rx="4" ry="5.5" fill="#7b68c2" opacity="0.7"/>
        <ellipse cx="4.5" cy="-2" rx="4" ry="5.5" fill="#7b68c2" opacity="0.7" transform="rotate(36,4.5,-2)"/>
        <ellipse cx="-4.5" cy="-2" rx="4" ry="5.5" fill="#7b68c2" opacity="0.7" transform="rotate(-36,-4.5,-2)"/>
        <ellipse cx="5.5" cy="3" rx="4" ry="5.5" fill="#9080d8" opacity="0.55" transform="rotate(62,5.5,3)"/>

      <path d="M144,13 Q150,6 154,13" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M152,15 Q156,8 150,7 Q150,13 152,15" fill="#2a6040" opacity="0.55"/>

  <!-- Quote -->
  <div class="quote-frame">
    <div class="quote-topper">❧ ✿ ❧</div>
    <!-- Quote corner accents -->
    <svg class="quote-corner tl" viewBox="0 0 28 28" fill="none"><path d="M2,2 Q12,2 14,12 Q16,20 10,26" stroke="#c9a84c" stroke-width="1" opacity="0.5"/><circle cx="14" cy="11" r="3" fill="#7b68c2" opacity="0.6"/><path d="M10,18 Q4,16 6,10 Q10,15 10,18" fill="#2a6040" opacity="0.5"/></svg>
    <svg class="quote-corner tr" viewBox="0 0 28 28" fill="none"><path d="M2,2 Q12,2 14,12 Q16,20 10,26" stroke="#c9a84c" stroke-width="1" opacity="0.5"/><circle cx="14" cy="11" r="3" fill="#7b68c2" opacity="0.6"/><path d="M10,18 Q4,16 6,10 Q10,15 10,18" fill="#2a6040" opacity="0.5"/></svg>
    <svg class="quote-corner bl" viewBox="0 0 28 28" fill="none"><path d="M2,2 Q12,2 14,12 Q16,20 10,26" stroke="#c9a84c" stroke-width="1" opacity="0.5"/><circle cx="14" cy="11" r="3" fill="#7b68c2" opacity="0.6"/><path d="M10,18 Q4,16 6,10 Q10,15 10,18" fill="#2a6040" opacity="0.5"/></svg>
    <svg class="quote-corner br" viewBox="0 0 28 28" fill="none"><path d="M2,2 Q12,2 14,12 Q16,20 10,26" stroke="#c9a84c" stroke-width="1" opacity="0.5"/><circle cx="14" cy="11" r="3" fill="#7b68c2" opacity="0.6"/><path d="M10,18 Q4,16 6,10 Q10,15 10,18" fill="#2a6040" opacity="0.5"/></svg>
    <div class="quote-label">A note from the universe</div>
    <div class="quote-text" id="quoteText">—</div>
    <div class="quote-sig">— The Universe ✦</div>
  </div>

  <!-- Care -->
  <div class="care-section">
    <div class="care-label">Tend to your garden</div>
    <button class="water-btn" id="waterBtn" onclick="waterPlant()">
      ✿ &nbsp; Water Her Today &nbsp; ✿
    </button>
  </div>

  <hr class="div-line">

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="statDays">0</span>
      <span class="stat-label">days tended</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="statStage">Seed</span>
      <span class="stat-label">stage</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="statStreak">0</span>
      <span class="stat-label">day streak</span>
    </div>
  </div>

  <div class="footer-orn">❧ ✿ ❀ ✿ ❦ ✿ ❀ ✿ ❧</div>

</div>

<script>
const QUOTES = [
  "Donna, the universe has been quietly rearranging things on your behalf since Tuesday. Just so you know.",
  "Here is something the roses understand that most people don't: blooming isn't the reward. It's the instruction.",
  "Did you know, Donna, that even the most magnificent orchid spent most of its life in the dark? You are right on schedule.",
  "The universe would like to formally acknowledge that its timing has sometimes seemed theatrical. It stands by the results.",
  "Donna, you were not designed for small stories. The universe just wanted to make sure you knew that.",
  "Whatever you are waiting for has been waiting for you considerably longer. That's simply how it works.",
  "The fact that something is growing in you right now — quietly, imperceptibly — is not something you can stop. Nature is like that. So is grace.",
  "Donna, the universe has seen your root system. It is not worried.",
  "Some things bloom in winter. Some bloom when everyone has stopped watching. Both are still called blooming.",
  "The soil doesn't ask the seed to explain itself. It simply holds it. The universe does the same with you, Donna.",
  "Nothing about the way you've grown has been accidental. Not the hard years. Especially not those.",
  "An orchid doesn't apologize for how long it takes. Take notes.",
  "Donna, every single thing you've loved into existence has left its mark on the world. The universe has been keeping count.",
  "The most tenacious root systems belong to the most magnificent things. The universe thought you should know that's not a coincidence.",
  "The universe is not running behind schedule, Donna. It is simply — as usual — being theatrical.",
  "You are allowed to want more. The orchid isn't humble about its magnificence. Neither should you be.",
  "What you are becoming is already so much more interesting than what you've been. The universe thought you should hear that.",
  "There is a version of your life so good it would make you laugh out loud. The universe is currently building it.",
  "Donna, the part of you that just knows things is almost always right. The universe would like you to trust it more.",
  "Not everything blooms in spring. Some things wait for the exact right quality of light. You'll know it when it's yours.",
  "The universe has noticed that you keep showing up. This is not a small thing. This is, in fact, everything.",
  "Growth is not always visible, Donna. Sometimes it is entirely subterranean and completely real.",
  "You are allowed to rest. Even the orchid has seasons where it is only gathering itself.",
  "The universe wrote your name down next to something very good a long time ago and hasn't crossed it out.",
  "Donna, what looks like patience is actually faith. What looks like faith is actually knowing. You've always known.",
  "The most beautiful things in any garden got there through a combination of care and complete surrender. You know about both.",
  "The universe finds your particular way of caring about things very moving. It would like you to know the feeling is mutual.",
  "An orchid grown in the right conditions becomes something that stops people mid-sentence. You are in the right conditions.",
  "Whatever was lost was never the whole story. The universe writes in longer arcs than that.",
  "Donna, the universe has been leaning in your direction for years. Some people call it luck. It isn't.",
  "The flower doesn't struggle to open. It simply cannot help it, given enough light. You are not short on light.",
  "Something wonderful is already in motion. The universe thought you might like a heads up.",
  "Donna, you have arrived at this exact moment via a very specific and curated series of events. The universe selected every one.",
  "The things that made you tender also made you extraordinary. The universe counted on both.",
  "What is rooted in you cannot be taken. The universe built it that way on purpose.",
  "Donna, even when the universe goes quiet, it is not being still. There's a difference.",
  "The best chapters don't announce themselves. Sometimes they begin on an ordinary afternoon while you're tending something.",
  "You were not given your particular way of seeing the world by accident. The universe had plans for that vision.",
  "Donna, the universe would like to gently suggest that you are precisely as magnificent as the things you stop to notice.",
  "Some days the whole point is to water the plant and trust the rest. The universe is a fan of these days.",
  "You are not waiting for your life to begin, Donna. You are so thoroughly, beautifully in the middle of it.",
  "The universe has dispatched abundance in your direction. It is traveling, as abundance sometimes does, at its own pace.",
  "Every beautiful thing you've tended — every plant, every person, every small ordinary day — has been an act of quiet courage.",
  "What grows from care is always different from what grows from force. You have always known which one you're working with.",
  "The universe would like to point out that you have never once failed to show up for the things that mattered. That's the whole game.",
  "Donna, the orchid doesn't bloom for the room. It blooms because that's what it is. You understand this.",
  "Everything you've planted in kindness is still growing somewhere. The universe has been keeping the garden.",
  "Here is the thing about roots: you cannot see them, and they hold everything. This is also true of love.",
  "Donna, the universe is conspiring — not subtly — in your favor. It usually is. You're simply more ready to notice it now.",
  "The most glorious blooms often follow the longest winters. The orchid on your windowsill could tell you stories.",
  "You don't have to understand the whole plan, Donna. You just have to water the plant.",
  "Something about you makes the people around you more themselves. The universe put that there deliberately.",
  "Donna, your timing has been exactly right. The universe knows this even on the days you've doubted it.",
  "The seeds you cannot yet see are the ones the universe is most excited about.",
  "Whatever chapter this is, Donna, it is not the last beautiful one. The universe has quite a few more planned.",
  "You are made of the same material as the things you find most astonishing. Sit with that for a moment.",
  "Donna, love that roots is love that lasts. You have always known how to root.",
  "The universe has a long memory. Every kindness you've ever scattered is still in the ledger. The columns are in your favor.",
  "An orchid in full bloom is not an accident. It is the result of everything that came before, tended well. This is also you.",
  "Donna, the universe would like you to know: there is nothing you're carrying that you have to carry alone.",
  "The universe is very good at the long game. It would like you to know you are one of its favorite ongoing projects.",
  "Donna, you have been growing toward something magnificent for longer than you know. The universe has a front-row seat.",
  "The quiet moments count too. The universe is filing them all.",
  "What you call 'just getting through it' the universe calls 'extraordinary.' Perspective is everything.",
  "Donna, the universe would like to formally object to any story that ends with 'I'm not enough.' The evidence doesn't support it.",
  "Some people change the air in a room just by entering it. Donna, you are some people.",
  "The universe has arranged for good things to find you. They are, as we speak, en route.",
  "Growth rarely announces itself. One day you'll look back and realize you bloomed somewhere between Tuesday and now.",
  "Donna, the universe is endlessly charmed by the specific and particular way you love the world. Don't stop.",
  "The most important thing you've ever planted is still growing. The universe is very pleased with how it's doing.",
  "Donna, you have never once been as lost as you thought. The universe has a different word for where you were: becoming.",
  "The orchid was not in a hurry. Neither were the stars. Neither, Donna, should you be.",
];

const STAGE_LABELS = [
  "Resting in soil, dreaming of what she'll become...",
  "She stirs — the first tender shoot appears ✦",
  "Growing in earnest, reaching for something she can't yet name",
  "Buds forming — the mystery deepens ✦",
  "She opens — your orchid has her first bloom",
  "In full and magnificent glory ✦ She has arrived",
];

const STAGE_NAMES = ["Seed", "Shoot", "Growing", "Budding", "Blooming", "Full Bloom"];
const THRESHOLDS = [0, 1, 5, 12, 20, 28];

const BLOOM_MESSAGES = [
  null,
  { title: "She Stirs", msg: "From stillness, a shoot. The universe would like to note that all magnificent things begin exactly like this — quietly, and when no one is quite expecting it." },
  { title: "She Grows", msg: "Look at those leaves, Donna. She is reaching for something. So, the universe suspects, are you." },
  { title: "Buds Are Forming", msg: "Something is about to happen. The universe always feels this way just before the beautiful part." },
  { title: "She Blooms", msg: "There she is. Your first orchid flower, open and unashamed. The universe would like you to take a moment. You did that." },
  { title: "Full Bloom", msg: "She has arrived in all her glory. This is what patience and love grow into, Donna. The universe thought you should see it up close." },
];

// ── Utilities ──
function todayStr() { return new Date().toISOString().split('T')[0]; }
function daysBetween(a, b) { return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function get(k, d) { const v = localStorage.getItem('donna_' + k); return v === null ? d : v; }
function set(k, v) { localStorage.setItem('donna_' + k, v); }

function getStage(w) { for (let i = THRESHOLDS.length-1; i>=0; i--) if (w >= THRESHOLDS[i]) return i; return 0; }
function getProgress(w) {
  const s = getStage(w);
  if (s >= 5) return 100;
  return ((s + (w - THRESHOLDS[s]) / (THRESHOLDS[s+1] - THRESHOLDS[s])) / 5) * 100;
}

// ── Modal ──
function showModal(stage) {
  const m = BLOOM_MESSAGES[stage];
  if (!m) return;
  document.getElementById('modalTitle').textContent = m.title;
  document.getElementById('modalMsg').textContent = m.msg;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }

// ── Water ──
function waterPlant() {
  const today = todayStr();
  if (get('last', '') === today) return;

  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().split('T')[0];
  let streak = parseInt(get('streak', '0'));
  streak = (get('last', '') === yStr) ? streak + 1 : 1;

  const prev = parseInt(get('watered', '0'));
  const next = prev + 1;
  const prevStage = getStage(prev);
  const newStage  = getStage(next);

  set('last', today);
  set('watered', next);
  set('streak', streak);

  addSparkles();
  const frame = document.getElementById('plantFrame');
  frame.classList.add('watered');
  setTimeout(() => frame.classList.remove('watered'), 1400);

  updateUI();

  if (newStage > prevStage) {
    setTimeout(() => showModal(newStage), 800);
  } else {
    const msgs = ["✿ Watered with love, Donna ✿", "She felt that. Thank you ✦", "The universe noticed ✿", "A small act of care. Everything. ✦"];
    showNotif(msgs[Math.floor(Math.random() * msgs.length)]);
  }
}

// ── Sparkles ──
function addSparkles() {
  const frame = document.getElementById('plantFrame');
  const chars = ['✦','✿','·','❀','✦','·','✿','❀'];
  const colors = ['#4dbcbc','#c9a84c','#e8d5a3','#b0a0e8','#4dbcbc'];
  [[15,15],[80,10],[50,20],[25,50],[75,35],[40,70],[60,15],[85,55],[20,75],[65,65],[90,30],[35,40]].forEach(([x,y],i) => {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = chars[i % chars.length];
    s.style.cssText = `left:${x}%;top:${y}%;color:${colors[i%colors.length]};animation-delay:${i*0.07}s`;
    frame.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  });
}

// ── Notification ──
function showNotif(msg) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(n._t);
  n._t = setTimeout(() => n.classList.remove('show'), 3200);
}

// ── Update UI ──
function updateUI() {
  const today = todayStr();
  if (!get('start', null)) set('start', today);
  const watered = parseInt(get('watered', '0'));
  const streak  = parseInt(get('streak', '0'));
  const daysSince = daysBetween(get('start', today), today);
  const stage = getStage(watered);
  const done  = get('last', '') === today;

  // Orchid stage
  for (let i = 0; i <= 5; i++) {
    const el = document.getElementById('s' + i);
    if (el) el.setAttribute('display', i === stage ? 'block' : 'none');
  }

  document.getElementById('stageLabel').textContent = STAGE_LABELS[stage];
  document.getElementById('progressFill').style.width = getProgress(watered) + '%';
  const sl = document.getElementById('progressStageLabel');
  if (sl) sl.textContent = `Stage ${stage + 1} of 6 — ${STAGE_NAMES[stage]}`;

  // Quote — one per calendar day
  document.getElementById('quoteText').textContent = QUOTES[daysSince % QUOTES.length];

  // Button
  const btn = document.getElementById('waterBtn');
  btn.disabled = done;
  btn.textContent = done ? '✦  Watered with love today  ✦' : '✿  Water Her Today  ✿';
  btn.classList.toggle('done', done);

  // Stats
  document.getElementById('statDays').textContent   = watered;
  document.getElementById('statStage').textContent  = STAGE_NAMES[stage];
  document.getElementById('statStreak').textContent = streak;

  // Date
  const now = new Date();
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  document.getElementById('dayCount').textContent = daysSince === 0
    ? 'The very first day of your garden  ✦'
    : 'Day ' + (daysSince + 1) + ' of your garden journey';
}

// ── Init ──
if (!get('start', null)) set('start', todayStr());
updateUI();

// ── Floating petals ──
function spawnPetal() {
  const container = document.getElementById('petal-container');
  if (!container) return;
  const shapes = ['✿', '❀', '✾', '❁', '✽'];
  const colors = ['#d4a8cc', '#b0a0e8', '#c9a84c88', '#4dbcbc88', '#e8d5a3aa'];
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = shapes[Math.floor(Math.random() * shapes.length)];
  p.style.left = (Math.random() * 100) + 'vw';
  p.style.fontSize = (9 + Math.random() * 11) + 'px';
  p.style.color = colors[Math.floor(Math.random() * colors.length)];
  const dur = 12 + Math.random() * 14;
  p.style.animation = `petalFall ${dur}s linear forwards`;
  container.appendChild(p);
  setTimeout(() => p.remove(), dur * 1000 + 500);
}
// Stagger initial petals
for (let i = 0; i < 6; i++) setTimeout(spawnPetal, i * 1800);
setInterval(spawnPetal, 3000);

// ── Twinkling background stars ──
function createStars() {
  const count = 18;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'twinkle';
    s.textContent = '✦';
    s.style.left  = (Math.random() * 100) + 'vw';
    s.style.top   = (Math.random() * 100) + 'vh';
    s.style.fontSize = (5 + Math.random() * 6) + 'px';
    s.style.animationDuration = (3 + Math.random() * 5) + 's';
    s.style.animationDelay    = (Math.random() * 6) + 's';
    document.body.appendChild(s);
  }
}
createStars();

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
